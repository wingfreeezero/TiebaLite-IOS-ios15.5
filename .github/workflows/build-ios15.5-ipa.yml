name: Build iOS 15.5 Unsigned IPA

# 一次编译出一个未签名真机 IPA（Artifact + 打 tag 时发 Release）：
#   TiebaLite-<版本>-ios15.5.ipa   最低 iOS 15.5；本分支已把 iOS 26 的液态玻璃、
#                                  iOS 17 的 trait 观察/空态视图、iOS 16 的编辑菜单等
#                                  全部换成 15.5 落法（见 Sources/TiebaNative/Compat/）。
# 未签名（ad-hoc 签名）真机 IPA，供 SideStore / AltStore / ESign / TrollStore 重签侧载。
# 纯 Swift + Bazel：无 Node / npm / Metro / CocoaPods，也不需要任何 Apple 账号或 secret。
#
# 为什么 ad-hoc 等于"无签名"口径：rules_apple 对设备构建强制要求每个 bundle 都有
# provisioning_profile 工件（ios_rules.bzl 无条件挂 partial），但把签名身份设为
# ad-hoc（--ios_signing_cert_name=-）时它明确不拿该描述文件去签名
# （codesigning_support.bzl:528）。所以 Build 步现场生成一个结构合法的占位件，
# 产物是 ad-hoc 签名、无团队标识 —— 侧载工具会重签，不影响安装。

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        type: choice
        options:
          - Release
          - Debug
        default: Release
      tag_name:
        description: '发布到的 tag（如 v2.2.0-ios15.5；留空则只出 Artifact 不发 Release）'
        type: string
        required: false
        default: ''
      release_title:
        description: 'Release 标题（留空则用 tag 名）'
        type: string
        required: false
        default: ''
      release_notes:
        description: 'Release 说明（发布 Release 时填这里的文本）'
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'v*-ios15.5'

permissions:
  contents: write

jobs:
  build:
    name: Build
    # macOS 26 自带 Xcode 26.x（本工程用 SDK 26 编译、只是把部署底线降到 15.5）。
    runs-on: macos-26
    timeout-minutes: 120
    concurrency:
      group: ios155-build-${{ github.ref }}
      cancel-in-progress: true
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.bazel_cache/disk
            ~/.bazel_cache/repository
          key: bazel-ios155-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', '.bazelrc', '.bazelversion', 'BUILD.bazel', '**/BUILD.bazel') }}
          restore-keys: |
            bazel-ios155-${{ runner.os }}-

      - name: Enable Bazel disk/repository cache
        run: |
          cat > .bazelrc.user <<EOF
          build --disk_cache=$HOME/.bazel_cache/disk
          build --repository_cache=$HOME/.bazel_cache/repository
          EOF
          cat .bazelrc.user

      # 拆分卡口：//Sources/TiebaNative:Proto 依赖那 267 个 protoc 产物是 public。
      - name: Verify protoc-generated visibility
        run: |
          if ! grep -q 'name = "Proto"' Sources/TiebaNative/BUILD.bazel; then
            echo "skip: 本分支未拆 //Sources/TiebaNative:Proto，无需校验生成物可见性"
            exit 0
          fi
          total=$(ls Sources/TiebaNative/Proto/Generated/*.pb.swift | wc -l | tr -d ' ')
          missing=$(grep -L 'public ' Sources/TiebaNative/Proto/Generated/*.pb.swift | wc -l | tr -d ' ')
          echo "protoc 产物: $total 个，其中不含任何 public 声明的: $missing 个"
          if [ "$missing" != "0" ]; then
            echo "::error::有 $missing 个 protoc 产物不含 public 声明（拆 target 后跨 module 不可见）。"
            exit 1
          fi

      - name: Verify iOS 15.5 floor
        run: |
          # 防止有人把底线改回去：本工作流的产物必须真的能装进 15.5。
          grep -q 'ios_minimum_os=15.5' .bazelrc || { echo "::error::.bazelrc 的 --ios_minimum_os 不是 15.5"; exit 1; }
          grep -q 'minimum_os_version = "15.5"' BUILD.bazel || { echo "::error::BUILD.bazel 的 minimum_os_version 不是 15.5"; exit 1; }

      - name: Build (bazel, ad-hoc signed device IPA)
        run: |
          brew install bazelisk
          bazel --version
          # ── 占位描述文件（app 一份；Live Activity 扩展已随 16.1 底线删除）──
          mkdir -p Signing
          if [ -f Signing/app.mobileprovision ] && [ "$(wc -c < Signing/app.mobileprovision | tr -d ' ')" -gt 4096 ]; then
            echo "keep existing provisioning profile (looks real)"
          else
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            cat > "$tmp/profile.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>AppIDName</key><string>BuildPlaceholder</string>
          <key>ApplicationIdentifierPrefix</key><array><string>0000000000</string></array>
          <key>CreationDate</key><date>2026-01-01T00:00:00Z</date>
          <key>Platform</key><array><string>iOS</string></array>
          <key>Entitlements</key><dict/>
          <key>ExpirationDate</key><date>2040-01-01T00:00:00Z</date>
          <key>Name</key><string>BuildPlaceholder</string>
          <key>TeamIdentifier</key><array><string>0000000000</string></array>
          <key>TeamName</key><string>BuildPlaceholder</string>
          <key>TimeToLive</key><integer>3650</integer>
          <key>UUID</key><string>00000000-0000-0000-0000-000000000000</string>
          <key>Version</key><integer>1</integer>
          </dict></plist>
          PLIST
            openssl req -x509 -newkey rsa:2048 -nodes -keyout "$tmp/key.pem" -out "$tmp/cert.pem" \
              -days 3650 -subj "/CN=BuildPlaceholder" 2>/dev/null
            openssl smime -sign -in "$tmp/profile.plist" -signer "$tmp/cert.pem" -inkey "$tmp/key.pem" \
              -nodetach -outform der -out Signing/app.mobileprovision 2>/dev/null
            echo "wrote Signing/app.mobileprovision ($(wc -c < Signing/app.mobileprovision | tr -d ' ') bytes)"
          fi
          mode=$([ "$CONFIGURATION" = "Release" ] && echo release || echo debug)
          bazel build //:AppStripped --config=ci --config="$mode"

      - name: Package IPA
        run: |
          tag="${{ inputs.tag_name || github.ref_name }}"
          case "$tag" in
            v*) base="TiebaLite-$tag" ;;
            *)  base="TiebaLite-ios15.5-$(echo "${GITHUB_SHA}" | cut -c1-7)" ;;
          esac
          case "$base" in
            *ios15.5*) ;;
            *) base="${base}-ios15.5" ;;
          esac
          echo "IPA_NAME=${base}.ipa" >> "$GITHUB_ENV"
          mkdir -p build/Payload
          unzip -q bazel-bin/AppStripped.ipa -d build
          ( cd build && zip -qry "$(basename "${base}.ipa")" Payload )
          unzip -l "build/${base}.ipa" | head -20
          # 产物自检：最低系统版本必须是 15.5（不是 17.0 / 26.0），且不应带 Live Activity 扩展。
          got=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" build/Payload/*.app/Info.plist)
          echo "MinimumOSVersion = $got"
          [ "$got" = "15.5" ] || { echo "::error::产物的 MinimumOSVersion 是 $got，不是 15.5"; exit 1; }
          if [ -d build/Payload/*.app/PlugIns ]; then
            echo "::error::产物里仍有 PlugIns（扩展最低 16.1，会让 15.5 装不上）"
            ls -R build/Payload/*.app/PlugIns
            exit 1
          fi
          echo "OK: 15.5 底线产物校验通过"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa-ios15.5
          path: build/${{ env.IPA_NAME }}
          if-no-files-found: error

  release:
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.tag_name != '') ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download IPAs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          name: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_title != '') && inputs.release_title || (github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name) }}
          body: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || 'iOS 15.5 底线构建（未签名，供 SideStore / AltStore 重签侧载）' }}
          generate_release_notes: ${{ github.event_name != 'workflow_dispatch' }}
          files: dist/*.ipa
          fail_on_unmatched_files: true
